<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <title>Todotodo</title>
</head>

<body>
    <header>
        <video id="background-video" autoplay loop muted>
            <source src="vid/back-vid-short.mp4" type="video/mp4">
        </video>
        <nav>
            <ul id="top-nav">
                <li class="top-nav-item"><a href="">contact</a></li>
                <li class="top-nav-item"><a href="">about</a></li>
                <li class="top-nav-item"><a href="">home</a></li>
                <li class="top-nav-item"><a href="">cart</a></li>
            </ul>
        </nav>
        <div id="landing">
            <h1>TO-DO LIST</h1>
            <a href="">get to it</a>
        </div>
    </header>
    <main>
        <article id="form-holder">
            <form action="" id="task-form">
                <label for="task" id="label-task">Write a task you wish to do...</label>
                <textarea type="text" name="task" id="task" form="task-form"></textarea>
                <button type="submit" id="task-btn">submit</button>
            </form>
            <p>It's important to plan your day :)</p>
        </article>
        <article id="task-holder">
            <ul id="task-list">

            </ul>
        </article>
    </main>
    <footer>
        <form id="newsletter">
            <div id="footer-heading-holder">
                <h1>Sign up for our <span>newsletter</span></h1>
                <h2>Get the latest promotions and offers from our company!</h2>
            </div>
            <div id="label-input-holder">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <label for="fName">First Name:</label>
                <input type="text" id="fName" name="fName">
                <label for="lName">Last name:</label>
                <input type="text" id="lName" name="lName">
                <label for="country">Country:</label>
                <input type="text" id="country" name="country">
            </div>
            <button type="submit">Let's do it</button>
        </form>
        <p>It was a pleasure working with you!</p>
        <div id="footer-div">
            <ul>
                <li><span>Links</span></li>
                <li>contact</li>
                <li>about</li>
                <li>home</li>
                <li>cart</li>
            </ul>
            <div>
                <img src="pics/instagram.png" alt="instagram">
                <img src="pics/facebook.png" alt="facebook">
                <img src="pics/twitter.png" alt="twitter">
            </div>
            <h1>TO-DO LIST</h1>
        </div>
    </footer>
</body>

</html>
