<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="app.js" defer></script>
    <title>Calculator</title>
</head>

<body>
    <header>
        <h1>mighty calculator</h1>
    </header>
    <main>
        <article>
            <h2>↓ The result ↓</h2>
            <div>
                <div>
                    <input id="output-box"> 
                </div>
                <button id="equals" onclick="calculate()">=</button>
            </div>
        </article>
        <section>
            <ul>
                <li>
                    <button id="1" onclick="appendToDisplay('1')">1</button>
                </li>
                <li>
                    <button id="2" onclick="appendToDisplay('2')">2</button>
                </li>
                <li>
                    <button id="3" onclick="appendToDisplay('3')">3</button>
                </li>
                <li>
                    <button id="plus" onclick="appendToDisplay('+')">+</button>
                </li>
                <li>
                    <button id="4" onclick="appendToDisplay('4')">4</button>
                </li>
                <li>
                    <button id="5" onclick="appendToDisplay('5')">5</button>
                </li>
                <li>
                    <button id="6" onclick="appendToDisplay('6')">6</button>
                </li>
                <li>
                    <button id="minus" onclick="appendToDisplay('-')">-</button>
                </li>
                <li>
                    <button id="7" onclick="appendToDisplay('7')">7</button>
                </li>
                <li>
                    <button id="8" onclick="appendToDisplay('8')">8</button>
                </li>
                <li>
                    <button id="9" onclick="appendToDisplay('9')">9</button>
                </li>
                <li>
                    <button id="multiply" onclick="appendToDisplay('*')">*</button>
                </li>
                <li>
                    <button id="clear" onclick="clearDisplay()">C</button>
                </li>
                <li>
                    <button id="0" onclick="appendToDisplay('0')">0</button>
                </li>
                <li>
                    <button id="dot" onclick="appendToDisplay('.')">.</button>
                </li>
                <li>
                    <button id="divide" onclick="appendToDisplay('/')">/</button>
                </li>
            </ul>
        </section>
    </main>
</body>

</html>
